[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "recon-nexus"
version = "1.0.0"
description = "Attack surface discovery and OSINT reconnaissance engine"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Thenuda Sahas", email = "thenudasahas2008@gmail.com" }]
dependencies = [
    "pydantic>=2.0.0",
]

[project.scripts]
recon-nexus = "reconnexus.cli:main"
